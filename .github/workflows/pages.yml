name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # the live app is what the crew uses on race day: nothing deploys unless every e2e scenario passes
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run e2e scenarios (headless Chrome, fake clock)
        env:
          CHROME: google-chrome
          CHROME_FLAGS: --no-sandbox
        run: google-chrome --version && tests/e2e/run.sh
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp offline-cache version (phones pick up the new build)
        run: sed -i "s/const VERSION = 'pitdog-[^']*'/const VERSION = 'pitdog-${GITHUB_SHA::7}'/" app/sw.js && grep "const VERSION" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
